    <h1>Q14ZA Dashboard / Google Health Obsidian</h1>
    <p>Google Healthから本人の睡眠データを読み取り、本人が管理するMac上のObsidianデイリーノートへ記録する個人用ツールです。</p>
    <p>取得対象は、睡眠開始・終了時刻、総睡眠時間、深い睡眠、浅い睡眠、REM睡眠、覚醒時間です。Google Healthへの書き込みは行いません。</p>
    <p>処理は本人のMac内で実行され、取得した健康データを外部の独自サーバーへ送信しません。</p>
